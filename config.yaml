# spencer 单一真相源配置 —— 所有模块只从这里读参数，不各自硬编码
data_dir: data
output_dir: output

universe: a800           # hs300 / zz500 / a800(两者并集) —— 快照口径, PIT化见路线图M7
start: "2016-01-01"
end: ""                  # 空 = 取到最新交易日

label:
  horizon: 5             # 前瞻收益天数 (因子在T日, 吃 T+1 → T+1+horizon 的收益)

fundamentals_cache: data/raw/fundamentals_yjbb.parquet   # PIT财报缓存(单一真相源)

universe_pit:            # PIT宇宙构造参数(build_pit_universe)
  min_list_days: 120     # 新股预热
  exclude_st: true
  top_n_liquidity: 1500  # 过去60日成交额中位数截面前N; null=不截断

portfolio:               # 组合默认参数(2026-07-23 rebal_sweep 定: 6格高原上按成本稳健性取)
  top_n: 50
  buffer_n: 80
  rebal_days: 20         # 6.8x年换手拿到与11.5x同档的超额sharpe(0.68), 见 output/rebal_sweep.csv

eval:
  quantiles: 5           # 分层数
  min_names: 30          # 单日截面最少股票数, 低于此日的IC作废
  warmup_days: 60        # 新股预热期: 上市不足N个交易日不进因子截面
  cost_bps: 15           # 回测单边成本(基点), 含佣金+印花+冲击的研究级近似
